version: "3.9"

services:
  app:
    image: whatsapp-saas:latest
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # ── Database ──────────────────────────────────────────────────────────
      DATABASE_URL: ${DATABASE_URL}

      # ── App ───────────────────────────────────────────────────────────────
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}

      # ── Public URL (used in password reset links + MSG91 webhook guide) ───
      APP_URL: ${APP_URL:-http://localhost:3000}
      FRONTEND_URL: ${APP_URL:-http://localhost:3000}
      BACKEND_URL: http://127.0.0.1:4000

      # ── Ports (internal — do not change) ──────────────────────────────────
      BACKEND_PORT: "4000"
      FRONTEND_PORT: "3000"

      # ── Seed defaults (first deploy only) ─────────────────────────────────
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@demo.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
      SEED_WORKSPACE_NAME: ${SEED_WORKSPACE_NAME:-Demo Workspace}

      # ── Optional ──────────────────────────────────────────────────────────
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v19.0}
      APP_NAME: ${APP_NAME:-WA SaaS Lite}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-hello@example.com}
